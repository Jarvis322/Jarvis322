<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Yiğit — indie developer</title>
  <desc id="d">Profile banner with an animated arc reactor and the tagline: building native macOS and iOS apps.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0c10"/>
      <stop offset="1" stop-color="#1a120a"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b3f"/>
      <stop offset="1" stop-color="#f0a500"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f0a500" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#e62429" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e62429" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>
  <style>
    .sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Helvetica,Arial,sans-serif}
    .mono{font-family:"SF Mono",ui-monospace,"Fira Code",Menlo,Consolas,monospace}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes spinr{to{transform:rotate(-360deg)}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
    .r1{transform-origin:960px 190px;animation:spin 24s linear infinite}
    .r2{transform-origin:960px 190px;animation:spinr 16s linear infinite}
    .core{transform-origin:960px 190px;animation:breathe 4s ease-in-out infinite}
    .dot{animation:pulse 2s ease-in-out infinite}
    @media (prefers-reduced-motion:reduce){.r1,.r2,.core,.dot{animation:none}}
  </style>

  <g clip-path="url(#round)">
    <rect width="1200" height="380" fill="url(#bg)"/>
    <rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="960" cy="190" r="330" fill="url(#glow)"/>

    <g fill="none" stroke-linecap="round">
      <circle cx="960" cy="190" r="150" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1"/>
      <g class="r1">
        <circle cx="960" cy="190" r="128" stroke="url(#hot)" stroke-width="2" stroke-dasharray="4 14" stroke-opacity="0.9"/>
      </g>
      <g class="r2">
        <circle cx="960" cy="190" r="104" stroke="#f0a500" stroke-width="6" stroke-dasharray="54 24 12 24" stroke-opacity="0.85"/>
      </g>
      <circle cx="960" cy="190" r="78" stroke="#e62429" stroke-width="1.5" stroke-opacity="0.8"/>
      <g class="core">
        <circle cx="960" cy="190" r="56" fill="#f0a500" fill-opacity="0.10" stroke="#ffd76b" stroke-width="1.5"/>
        <path d="M960 142 L1001.6 214 H918.4 Z" stroke="#ffd76b" stroke-width="2" stroke-linejoin="round" fill="#f0a500" fill-opacity="0.16"/>
        <circle cx="960" cy="190" r="12" fill="#fff3d6"/>
      </g>
    </g>

    <g transform="translate(72 84)">
      <circle class="dot" cx="6" cy="6" r="5" fill="#ff3b3f"/>
      <text x="22" y="11" class="mono" font-size="14" letter-spacing="3" fill="#f0a500">J.A.R.V.I.S. ONLINE</text>
    </g>

    <text x="72" y="178" class="sans" font-size="64" font-weight="700" letter-spacing="-1.5" fill="#ffffff">Good morning,</text>
    <text x="72" y="248" class="sans" font-size="64" font-weight="700" letter-spacing="-1.5" fill="url(#hot)">I'm Yiğit.</text>

    <text x="74" y="294" class="sans" font-size="21" fill="#ffffff" fill-opacity="0.72">Native macOS &amp; iOS apps, and the websites around them.</text>

    <g class="mono" font-size="13" transform="translate(72 320)">
      <rect width="72" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="36" y="19.5" text-anchor="middle" fill="#ffd76b">Swift</text>
      <rect x="82" width="90" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="127" y="19.5" text-anchor="middle" fill="#ffd76b">SwiftUI</text>
      <rect x="182" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="238" y="19.5" text-anchor="middle" fill="#ffd76b">TypeScript</text>
      <rect x="304" width="80" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="344" y="19.5" text-anchor="middle" fill="#ffd76b">Python</text>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="379" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
  </g>
</svg>
